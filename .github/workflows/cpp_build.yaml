name: C++ build and tests

on: [push, pull_request, workflow_dispatch]

env:
  FIXTURE_URL: https://github.com/cr333/OmniPhotos/releases/download/v1.0/OmniPhotos-test-data.zip
  FIXTURE_SHA256: 5b9380c2004fae49af7f52de774ddfbdb7952d61b98a9d9aa146fe8351b1ce1d

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglfw3-dev libeigen3-dev libopencv-dev ninja-build
          git clone --depth 1 --branch v0.7.1 https://github.com/google/glog.git "$RUNNER_TEMP/glog"
          test "$(git -C "$RUNNER_TEMP/glog" rev-parse HEAD)" = 7b134a5c82c0c0b5698bb6bf7a835b230c5638e4
          cmake -S "$RUNNER_TEMP/glog" -B "$RUNNER_TEMP/glog-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glog-install" -DWITH_GFLAGS=OFF -DWITH_UNWIND=OFF -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/glog-build"
          cmake --install "$RUNNER_TEMP/glog-build"
      - name: Download dataset fixture
        run: |
          curl --fail --location --retry 2 "$FIXTURE_URL" -o "$RUNNER_TEMP/testDatasets.zip"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' "$FIXTURE_SHA256" testDatasets.zip | sha256sum --check
          unzip -q testDatasets.zip
      - name: Build and test
        env:
          OMP_NUM_THREADS: '4'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/glog-install" -DWITH_TEST=ON -DOMNIPHOTOS_TEST_DATA="$RUNNER_TEMP/testDatasets"
          cmake --build build --parallel 4
          ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        shell: pwsh
        run: |
          vcpkg install opencv4 glfw3 eigen3 glog --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --depth 1 --branch v2.15.6 https://github.com/ValveSoftware/openvr.git "$env:RUNNER_TEMP/openvr"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download dataset fixture
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/testDatasets.zip"
          curl.exe --fail --location --retry 2 $env:FIXTURE_URL -o $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive).Hash.ToLower() -ne $env:FIXTURE_SHA256) { throw 'Unexpected dataset checksum' }
          Expand-Archive $archive $env:RUNNER_TEMP
      - name: Build and test
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DWITH_OPENVR=ON "-DOPENVR_ROOT_DIR=$env:RUNNER_TEMP/openvr" -DWITH_TEST=ON "-DOMNIPHOTOS_TEST_DATA=$env:RUNNER_TEMP/testDatasets"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
