name: Python preprocessing tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Python/preprocessing/requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
          python -m pip install -r Python/preprocessing/requirements.txt
          python -m pip check
      - name: Download dataset fixture
        run: |
          curl --fail --location --retry 2 -o testDatasets.zip https://github.com/cr333/OmniPhotos/releases/download/v1.0/OmniPhotos-test-data.zip
          echo '5b9380c2004fae49af7f52de774ddfbdb7952d61b98a9d9aa146fe8351b1ce1d  testDatasets.zip' | sha256sum --check
          unzip -q testDatasets.zip
      - name: Run preprocessing tests
        env:
          OP_TEST_ROOT_DIR: ${{ github.workspace }}/testDatasets/circular/Hilltop
          MPLBACKEND: Agg
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python Python/preprocessing/test/main.py -v
